<style>
:root{--bg:#fafaf8;--sf:#fff;--tx:#1c1c1a;--mu:#7a7a74;--ln:#ececE6;--ac:#2f7d5b;--ac2:#e6f2ec;--wn:#c77d0a;--wn2:#fdf1dc;--er:#c0392b;--er2:#fbe6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--sf:#1c1c1a;--tx:#efefe9;--mu:#9a9a92;--ln:#2c2c29;--ac:#5fc294;--ac2:#1d2e26;--wn:#e8a94a;--wn2:#33291a;--er:#ef7b6e;--er2:#38211e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--sf:#1c1c1a;--tx:#efefe9;--mu:#9a9a92;--ln:#2c2c29;--ac:#5fc294;--ac2:#1d2e26;--wn:#e8a94a;--wn2:#33291a;--er:#ef7b6e;--er2:#38211e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.3px}
header span{color:var(--mu);font-size:13px}
main{padding:8px 16px 150px;max-width:640px;margin:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:8px 0;border-radius:10px}
nav button.on{color:var(--ac);font-weight:600}
nav b{display:block;font-size:18px;font-weight:400}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:6}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.row .g{flex:1;min-width:0}
.row .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mu);font-size:12.5px}
.r{text-align:right;white-space:nowrap}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);font-weight:600;margin:20px 4px 4px}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--ac2);color:var(--ac);font-weight:500}
.tag.w{background:var(--wn2);color:var(--wn)}.tag.e{background:var(--er2);color:var(--er)}
.up{color:var(--er)}.dn{color:var(--ac)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
label{font-size:12px;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:#fff;font-weight:500}
.btn.g2{background:var(--ac2);color:var(--ac)}.btn.d{background:var(--er2);color:var(--er)}
.btn.sm{padding:6px 10px;font-size:13px}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:32px;font-weight:600;letter-spacing:-1px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20;align-items:flex-end}
#sh.on{display:flex}
#sh>div{background:var(--sf);width:100%;max-width:640px;margin:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.chk{width:22px;height:22px;margin:0;accent-color:var(--ac)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}
.mini{display:grid;grid-template-columns:1fr 72px 28px;gap:6px;align-items:center}
.mini input,.mini select{margin:2px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:20px;padding:6px 13px;font:inherit;font-size:13px}
.chip.on{background:color-mix(in srgb,var(--k,var(--ac)) 15%,var(--sf));color:var(--k,var(--ac));border-color:color-mix(in srgb,var(--k,var(--ac)) 40%,transparent);font-weight:600}
.sec{display:flex;align-items:center;gap:8px;margin:16px 4px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--k);font-weight:600}.sec i{width:9px;height:9px;border-radius:50%;background:var(--k)}.sec span{margin-left:auto;color:var(--mu);font-weight:500}
.kc{border-left:3px solid var(--k);background:linear-gradient(90deg,color-mix(in srgb,var(--k) 7%,var(--sf)),var(--sf) 60%);padding:4px 14px;margin-top:4px}
.k0{--k:#5a9a68}.k1{--k:#e08a3c}.k2{--k:#d4b24a}.k3{--k:#d1665e}.k4{--k:#b8875a}.k5{--k:#9a9159}.k6{--k:#3fa3a0}.k7{--k:#9a7bc4}.k8{--k:#6aaed6}.k9{--k:#4f84c4}.k10{--k:#d77fa3}.k11{--k:#8a8a84}
@media (prefers-color-scheme:dark){.k0{--k:#82c28f}.k1{--k:#efa564}.k2{--k:#e3c76d}.k3{--k:#e58d85}.k4{--k:#d2a77c}.k5{--k:#bdb27a}.k6{--k:#6fc4c1}.k7{--k:#b79ddb}.k8{--k:#86c1e6}.k9{--k:#7aa6df}.k10{--k:#e79bbb}.k11{--k:#a9a9a2}}
</style></head><body>
<header><h1>Grocery Stash</h1><span id="hd"></span></header>
<main id="m"></main>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav id="nav"></nav>
<div id="sh"><div id="shc"></div></div>
<script>
var CATS=["Vegetables","Fruits","Dairy & Eggs","Meat & Fish","Bakery","Pantry","Beverages","Snacks","Frozen","Cleaning","Personal care","Other"];
var KW={Vegetables:"onion tomato carrot potato lettuce spinach broccoli cucumber pepper garlic cabbage",Fruits:"apple banana orange grape lemon mango berry strawberry avocado melon","Dairy & Eggs":"milk cheese yogurt butter egg cream","Meat & Fish":"chicken beef pork fish salmon shrimp bacon sausage",Bakery:"bread bun bagel tortilla cake",Beverages:"juice soda water coffee tea beer wine",Cleaning:"detergent soap bleach sponge cleaner wipes dish trash","Personal care":"shampoo toothpaste deodorant lotion tissue",Frozen:"frozen ice pizza",Snacks:"chips cookie chocolate candy cracker",Pantry:"rice pasta flour sugar salt oil sauce cereal beans"};
var S={p:[],l:[],b:0},tab="pantry",mo=tdy().slice(0,7),q="";
try{var raw=localStorage.getItem("gs1");if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem("gs1",JSON.stringify(S))}catch(e){}hdr()}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $$(n){return "\u20b1"+(+n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function key(n){return n.trim().toLowerCase()}
function tdy(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function addd(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function rk(l){return key(String(l).replace(/[\s$]*(\d{1,3}(?:,\d{3})+\.\d{2}|\d+[.,]\d{2})\s*[A-Za-z]?\s*$/,"").replace(/^[\d\s#*-]+/,"").replace(/\s+/g," "))}
function dleft(d){return Math.round((new Date(d+"T00:00:00")-new Date(tdy()+"T00:00:00"))/864e5)}
function fd(d){return new Date(d+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function guess(n){return cat2(n)}
function hist(n){return S.p.filter(function(x){return key(x.n)==key(n)}).sort(function(a,b){return a.d<b.d?-1:1})}
function low(n){var h=hist(n),m=null;h.forEach(function(x){if(!m||x.pr<m.pr)m=x});return m}
function stock(n){return S.p.filter(function(x){return key(x.n)==key(n)&&!x.u})}
function badge(x){if(!x.e)return"";var d=dleft(x.e);if(d<0)return'<span class="tag e">Expired</span>';if(d<=3)return'<span class="tag w">'+(d===0?"Today":d+"d left")+"</span>";return'<span class="tag">'+fd(x.e)+"</span>"}
function tabs(){var t=[["pantry","◐","Pantry"],["products","☰","Prices"],["list","✓","Grocery"],["sum","◔","Summary"],["mkt","\u20b1","Market"]];$("nav").innerHTML=t.map(function(a){return'<button class="'+(tab==a[0]?"on":"")+'" data-t="'+a[0]+'"><b>'+a[1]+"</b>"+a[2]+"</button>"}).join("");
$("nav").onclick=function(e){var b=e.target.closest("button");if(b){tab=b.dataset.t;draw()}}}
function draw(){tabs();var v={pantry:pantry,products:products,list:list,sum:summary,mkt:market}[tab]();$("m").innerHTML=v;hdr();bind();bind2()}
var PF={q:"",c:"All",s:"exp",w:"all"},RF={q:"",c:"All",s:"name",w:"all"},OPEN={};
function ck(c){return"k"+Math.max(0,CATS.indexOf(c))}
function inw(d,w){return w=="all"||(w=="mo"?d.slice(0,7)==tdy().slice(0,7):dleft(d)>=-(+w))}
function bar(f,st,cats,sorts){var W=[["all","Any date"],["7","Last 7 days"],["30","Last 30 days"],["mo","This month"]];return'<input data-sq="'+f+'" placeholder="Search by name" value="'+esc(st.q)+'" style="margin:8px 0 6px"><div class="chips">'+["All"].concat(cats).map(function(c){return'<button class="chip '+(c=="All"?"":ck(c))+(st.c==c?" on":"")+'" data-cp="'+f+'" data-v="'+esc(c)+'">'+esc(c)+"</button>"}).join("")+'</div><div class="two" style="margin:6px 0 2px"><select data-ss="'+f+'" style="margin:0">'+sorts.map(function(o){return'<option value="'+o[0]+'"'+(st.s==o[0]?" selected":"")+">Sort: "+o[1]+"</option>"}).join("")+'</select><select data-sw="'+f+'" style="margin:0">'+W.map(function(o){return'<option value="'+o[0]+'"'+(st.w==o[0]?" selected":"")+">"+o[1]+"</option>"}).join("")+"</select></div>"}
function sec(c,n){return'<div class="sec '+ck(c)+'"><i></i>'+esc(c)+"<span>"+n+"</span></div>"}
function pantry(){var a=S.p.filter(function(x){return!x.u});
if(!a.length)return'<div class="empty">Nothing in your pantry yet.<br>Tap + to add items or scan a receipt.</div>';
var cats=CATS.filter(function(c){return a.some(function(x){return x.c==c})});if(cats.indexOf(PF.c)<0&&PF.c!="All")PF.c="All";
var soon=a.filter(function(x){return x.e&&dleft(x.e)<=3}).length;
return'<div class="sub" style="margin:6px 4px 0">'+a.length+" in stock"+(soon?" · "+soon+" expiring soon or expired":"")+"</div>"+bar("p",PF,cats,[["exp","Expiry (soonest)"],["name","Name A–Z"],["new","Recently bought"],["old","Oldest bought"]])+'<div id="lst">'+pantryList()+"</div>"}
function pantryList(){var a=S.p.filter(function(x){return!x.u&&(PF.c=="All"||x.c==PF.c)&&inw(x.d,PF.w)&&(!PF.q||key(x.n).indexOf(PF.q.trim().toLowerCase())>-1)});
if(!a.length)return'<div class="empty">No matches.</div>';
var g={};a.forEach(function(x){var k=key(x.n);(g[k]=g[k]||[]).push(x)});
var P=Object.keys(g).map(function(k){var b=g[k].sort(function(a,b){return(a.e||"9999")<(b.e||"9999")?-1:1}),ds=b.map(function(i){return i.d}).sort();return{k:k,b:b,n:b[0].n,c:b[0].c,e:b[0].e||"",dn:ds[0],dx:ds[ds.length-1]}});
var cmp={exp:function(a,b){var x=a.e||"9999",y=b.e||"9999";return x<y?-1:x>y?1:a.n.localeCompare(b.n)},name:function(a,b){return a.n.localeCompare(b.n)},"new":function(a,b){return a.dx<b.dx?1:-1},old:function(a,b){return a.dn<b.dn?-1:1}}[PF.s];
P.sort(cmp);var h="";
CATS.forEach(function(c){var ps=P.filter(function(p){return p.c==c});if(!ps.length)return;
h+=sec(c,ps.length)+'<div class="card kc '+ck(c)+'">'+ps.map(function(p){
if(p.b.length==1){var x=p.b[0];return'<div class="row"><div class="g" data-e="'+x.id+'"><div class="n">'+esc(x.n)+'</div><div class="sub">Bought '+fd(x.d)+(x.q>1?" · qty "+x.q:"")+"</div></div>"+badge(x)+'<button class="btn g2 sm" data-u="'+x.id+'">Used</button></div>'}
var o=OPEN[p.k];return'<div class="row" data-tg="'+esc(p.k)+'"><div class="g"><div class="n">'+esc(p.n)+' <span class="sub">×'+p.b.length+'</span></div><div class="sub">Latest bought '+fd(p.dx)+"</div></div>"+badge({e:p.e})+'<span class="sub">'+(o?"▴":"▾")+"</span></div>"+(o?p.b.map(function(x){return'<div class="row" style="padding-left:14px"><div class="g" data-e="'+x.id+'"><div class="sub">Bought '+fd(x.d)+(x.q>1?" · qty "+x.q:"")+"</div></div>"+badge(x)+'<button class="btn g2 sm" data-u="'+x.id+'">Used</button></div>'}).join(""):"")}).join("")+"</div>"});return h}
function products(){var ks={};S.p.forEach(function(x){ks[key(x.n)]=1});if(!Object.keys(ks).length)return'<div class="empty">No products yet.</div>';
var cats=CATS.filter(function(c){return S.p.some(function(x){return x.c==c})});if(cats.indexOf(RF.c)<0&&RF.c!="All")RF.c="All";
return bar("r",RF,cats,[["name","Name A–Z"],["recent","Recently bought"],["high","Latest price (high–low)"],["low","Latest price (low–high)"],["up","Biggest increase"],["down","Biggest drop"]])+'<div id="lst">'+productsList()+"</div>"}
function productsList(){var ks={};S.p.forEach(function(x){ks[key(x.n)]=1});
var P=Object.keys(ks).map(function(k){var hh=hist(k),l=hh[hh.length-1],p=hh[hh.length-2];return{k:k,l:l,m:low(k),df:p?l.pr-p.pr:0,c:l.c,n:l.n}}).filter(function(p){return(RF.c=="All"||p.c==RF.c)&&inw(p.l.d,RF.w)&&(!RF.q||p.k.indexOf(RF.q.trim().toLowerCase())>-1)});
if(!P.length)return'<div class="empty">No matches.</div>';
var cmp={name:function(a,b){return a.n.localeCompare(b.n)},recent:function(a,b){return a.l.d<b.l.d?1:a.l.d>b.l.d?-1:0},high:function(a,b){return b.l.pr-a.l.pr},low:function(a,b){return a.l.pr-b.l.pr},up:function(a,b){return b.df-a.df},down:function(a,b){return a.df-b.df}}[RF.s];
P.sort(cmp);var h="";
CATS.forEach(function(c){var ps=P.filter(function(p){return p.c==c});if(!ps.length)return;
h+=sec(c,ps.length)+'<div class="card kc '+ck(c)+'">'+ps.map(function(p){var tr=p.df==0?"":'<span class="'+(p.df>0?"up":"dn")+'">'+(p.df>0?"▲ ":"▼ ")+$$(Math.abs(p.df))+"</span>";
return'<div class="row" data-h="'+esc(p.k)+'"><div class="g"><div class="n">'+esc(p.n)+'</div><div class="sub">Lowest '+$$(p.m.pr)+(p.m.s?" at "+esc(p.m.s):"")+" · "+fd(p.m.d)+'</div></div><div class="r"><div>'+$$(p.l.pr)+'</div><div class="sub">'+tr+"</div></div></div>"}).join("")+"</div>"});return h}
var DA={asof:"October 21, 2026",page:"https://www.da.gov.ph/price-monitoring/",bp:"http://www.bantaypresyo.da.gov.ph/",rfo:"https://calabarzon.da.gov.ph/",wk:{t:"October 12\u201318, 2026",u:"https://www.da.gov.ph/wp-content/uploads/2026/10/Weekly-Average-Prices-October-12-18-2026.pdf"},dl:{t:"October 20, 2026",u:"https://www.da.gov.ph/wp-content/uploads/2026/10/Daily-Price-Index-October-20-2026.pdf"}};
function lk(t,s,u){return'<div class="row"><div class="g"><div class="n">'+t+'</div><div class="sub">'+s+'</div></div><a class="btn g2 sm" style="text-decoration:none;display:inline-block" href="'+u+'" target="_blank" rel="noopener">Open</a></div>'}
function qn(x){return x.q||1}
function ulab(u){return /item|pc|piece/i.test(u||"")?"item":"kilo"}
function addList(n,pr,q,u){var x=S.l.find(function(i){return key(i.n)==key(n)});if(x){if(!x.ap)x.ap=pr;if(q)x.q=q;if(u)x.u=u}else S.l.push({id:uid(),n:n,ap:pr,q:q||1,u:u||"item"});save()}
function list(){var est=0,done=0,np=0,mk=tdy().slice(0,7),spent=0;S.p.forEach(function(p){if(p.d.slice(0,7)==mk)spent+=p.pr*p.q});
S.l.forEach(function(x){var t=(x.ap||0)*qn(x);if(x.k)done+=t;else{est+=t;if(!x.ap)np++}});
var h='<div class="card"><input id="ln" placeholder="Add to grocery list" style="margin:0 0 8px"><div style="display:flex;gap:6px;align-items:center"><input id="lq" type="number" inputmode="decimal" step="any" min="0" value="1" style="margin:0;width:62px"><select id="lu" style="margin:0;width:104px"><option value="item">Per item</option><option value="kilo">Per kilo</option></select><input id="lp" type="number" inputmode="decimal" step="any" placeholder="₱ price" style="margin:0;flex:1;min-width:0"><button class="btn" id="la">Add</button></div><div class="sub" style="margin-top:6px">Approx price is per item or per kilo, times the quantity.</div></div>';
if(!S.l.length)return h+'<div class="empty">Your grocery list is empty.</div>';
h+='<div class="card"><div class="sub">Estimated cost of items left</div><div class="big" style="font-size:26px">'+$$(est)+'</div>'+(np?'<div class="sub">'+np+" item"+(np>1?"s":"")+" without an approx price</div>":"")+(S.b?'<div class="sub" style="margin-top:4px">'+(S.b-spent-est>=0?$$(S.b-spent-est)+" left of your "+$$(S.b)+" monthly budget after this list":$$(spent+est-S.b)+" over your "+$$(S.b)+" monthly budget if you buy all")+" · spent so far this month "+$$(spent)+"</div>":'<div class="sub" style="margin-top:4px">Set a monthly budget in Summary to compare.</div>')+(done?'<div class="sub">Checked off: '+$$(done)+"</div>":"")+"</div>";
h+='<div class="card">'+S.l.map(function(x){var st=stock(x.n),m=low(x.n),note="";
if(st.length){var s=st.filter(function(i){return i.e}).sort(function(a,b){return a.e<b.e?-1:1})[0];note='<span class="tag w">Have '+st.length+(s?" · exp "+fd(s.e):"")+"</span>"}else if(m)note='<span class="sub">Lowest '+$$(m.pr)+(m.s?" at "+esc(m.s):"")+"</span>";
var un=ulab(x.u);return'<div class="row" style="flex-wrap:wrap"><input type="checkbox" class="chk" data-c="'+x.id+'" '+(x.k?"checked":"")+'><div class="g"><div class="n" style="'+(x.k?"text-decoration:line-through;color:var(--mu)":"")+'">'+esc(x.n)+"</div>"+note+'</div><button class="btn d sm" data-ld="'+x.id+'">✕</button><div style="flex-basis:100%;display:flex;gap:6px;align-items:center;padding-left:32px"><input type="number" inputmode="decimal" step="any" data-lq="'+x.id+'" value="'+qn(x)+'" style="width:62px;margin:0"><select data-lu="'+x.id+'" style="width:90px;margin:0"><option value="item"'+(un=="item"?" selected":"")+'>item</option><option value="kilo"'+(un=="kilo"?" selected":"")+'>kilo</option></select><span class="sub">×</span><input type="number" inputmode="decimal" step="any" data-lp="'+x.id+'" value="'+(x.ap||"")+'" placeholder="₱" style="width:84px;margin:0"><span class="sub">= <b>'+$$((x.ap||0)*qn(x))+"</b></span></div></div>"}).join("")+"</div>";
