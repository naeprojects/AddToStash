name: Update DA links

on:
  schedule:
    - cron: "30 0,6,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the DA page and save the newest report links
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0 (compatible; GroceryStashLinkCheck/1.0)" https://www.da.gov.ph/price-monitoring/ -o page.html
          curl -fsSL --retry 3 -A "Mozilla/5.0 (compatible; GroceryStashLinkCheck/1.0)" https://calabarzon.da.gov.ph/da-calabarzon-bantay-presyo/ -o cz.html || true
          python3 - <<'PY'
          import re, json, urllib.parse, datetime

          M = ["january","february","march","april","may","june","july","august","september","october","november","december"]
          base = "https://www.da.gov.ph/price-monitoring/"
          html = open("page.html", encoding="utf8", errors="ignore").read()


          def parse(u):
              f = re.sub(r"\.pdf.*$", "", urllib.parse.unquote(u.split("/")[-1]), flags=re.I)
              m = re.search(r"([A-Za-z]+)[-_ ](\d{1,2})[-_ ]([A-Za-z]+)[-_ ](\d{1,2})[-_ ](\d{4})", f)
              if m and m.group(1).lower() in M and m.group(3).lower() in M:
                  key = int(m.group(5))*10000 + (M.index(m.group(3).lower())+1)*100 + int(m.group(4))
                  return key, "%s %s \u2013 %s %s, %s" % (m.group(1).title(), m.group(2), m.group(3).title(), m.group(4), m.group(5))
              m = re.search(r"([A-Za-z]+)[-_ ](\d{1,2})(?:[-_ ](\d{1,2}))?[-_ ](\d{4})", f)
              if not m or m.group(1).lower() not in M:
                  return None
              mo = M.index(m.group(1).lower()) + 1
              key = int(m.group(4))*10000 + mo*100 + int(m.group(3) or m.group(2))
              rng = m.group(2) + ("\u2013" + m.group(3) if m.group(3) else "")
              return key, "%s %s, %s" % (m.group(1).title(), rng, m.group(4))


          def fix_daily(entry):
              # The DA page sometimes lists the daily report under a different file name
              # (for example "October-22-2026-DPI-AFC.pdf") that does not open.
              # The usual name is "Daily-Price-Index-<Month>-<Day>-<Year>.pdf", so use that.
              if entry and not re.search(r"Daily-Price-Index-", entry["u"], re.I):
                  k = entry["key"]
                  y, m, d = k // 10000, (k // 100) % 100, k % 100
                  entry["alt"] = entry["u"]
                  entry["u"] = entry["u"].rsplit("/", 1)[0] + "/Daily-Price-Index-%s-%d-%d.pdf" % (M[m-1].title(), d, y)


          best = {}
          for u in re.findall(r"""href=["']([^"']+?\.pdf)["']""", html, flags=re.I):
              if re.search(r"cigarette|retail-price-range", u, re.I):
                  continue
              kind = "wk" if re.search(r"average", u, re.I) else ("dl" if re.search(r"price-index|dpi", u, re.I) else None)
              p = parse(u)
              if kind and p and (kind not in best or p[0] > best[kind]["key"]):
                  best[kind] = {"t": p[1], "u": urllib.parse.urljoin(base, u), "key": p[0]}

          import os
          if os.path.exists("cz.html"):
              czh = open("cz.html", encoding="utf8", errors="ignore").read()
              bestcz = None
              for m in re.finditer(r"""<a\b[^>]*href=["'](https://drive\.google\.com/file/d/([A-Za-z0-9_-]{20,})/[^"']*)["'][^>]*>(.*?)</a>""", czh, flags=re.I | re.S):
                  if m.group(2).lower().startswith("bc1"):
                      continue
                  text = re.sub(r"<[^>]*>", "", m.group(3)).replace("&nbsp;", " ").strip()
                  d = re.search(r"([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})", text)
                  if not d or d.group(1).lower() not in M:
                      continue
                  mo = M.index(d.group(1).lower()) + 1
                  key = int(d.group(3))*10000 + mo*100 + int(d.group(2))
                  if not bestcz or key > bestcz["key"]:
                      bestcz = {"t": "%s %d, %s" % (d.group(1).title(), int(d.group(2)), d.group(3)), "u": m.group(1), "key": key}
              if bestcz:
                  best["cz"] = bestcz

          if best.get("dl"):
              fix_daily(best["dl"])

          if not best:
              raise SystemExit("No reports found on the DA page")

          best["updated"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ")
          json.dump(best, open("da.json", "w", encoding="utf8"), ensure_ascii=False, indent=1)
          print(json.dumps(best, ensure_ascii=False, indent=1))
          PY
          rm -f page.html cz.html

      - name: Save da.json if it changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add da.json
          git diff --cached --quiet || (git commit -m "Update DA links" && git push)
